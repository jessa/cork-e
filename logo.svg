<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cork-e">
  <!-- Corkboard with a wooden frame -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#a87442"/>
  <rect x="7" y="7" width="50" height="50" rx="8" fill="#c8955e"/>
  <g fill="#b58250">
    <circle cx="14" cy="16" r="1.4"/><circle cx="48" cy="13" r="1.2"/>
    <circle cx="51" cy="44" r="1.4"/><circle cx="13" cy="47" r="1.2"/>
    <circle cx="30" cy="52" r="1.1"/>
  </g>
  <!-- A pinned card with a clock face -->
  <rect x="16" y="17" width="32" height="32" rx="3" fill="#fffcf6" transform="rotate(-4 32 33)"/>
  <circle cx="32" cy="34" r="11" fill="none" stroke="#4a4038" stroke-width="2.2"/>
  <path d="M32 34 L32 23 A11 11 0 0 1 42.5 30.6 Z" fill="#5ba85a"/>
  <path d="M32 34 L42.5 30.6 A11 11 0 0 1 38.5 42.9 Z" fill="#4a90d9"/>
  <line x1="32" y1="34" x2="32" y2="26" stroke="#4a4038" stroke-width="2.2" stroke-linecap="round"/>
  <!-- The pushpin -->
  <circle cx="32" cy="15" r="4.5" fill="#e8604c"/>
  <circle cx="30.6" cy="13.6" r="1.4" fill="#fff" opacity="0.6"/>
</svg>
